<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meao - Your Cute Dictionary Cat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <h1 class="app-title">Meao</h1>
            <p class="app-subtitle">Your friendly dictionary </p>
        </header>

        <!-- Main Cat Area -->
        <main class="cat-container">
            <div class="meao-image-container" id="meao-cat">
                <img src="meao.png" alt="Meao the Dictionary Cat" class="meao-image" id="meao-image">
                
                <!-- Eyes overlay for blinking animation -->
                <div class="eyes-overlay">
                    <div class="eye-blink left-eye-blink"></div>
                    <div class="eye-blink right-eye-blink"></div>
                </div>
            </div>
            
            <!-- Click hint -->
            <div class="click-hint" id="click-hint">
                <p>Click me to start searching! 🐾</p>
            </div>
        </main>

        <!-- Search Interface (initially hidden) -->
        <div class="search-container" id="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search for any word...">
                <button id="search-btn">
                    <span>🔍</span>
                </button>
            </div>
            
            <div class="language-toggle">
                <button class="lang-btn active" data-lang="en">English</button>
                <button class="lang-btn" data-lang="ja">日本語</button>
            </div>
            
            <div class="history-controls">
                <button class="history-btn" onclick="window.meaoCat.showHistory()">
                    <span>📚</span> History
                </button>
                <button class="bookmarks-btn" onclick="window.meaoCat.showBookmarks()">
                    <span>⭐</span> Bookmarks
                </button>
                <button class="voice-translation-btn" id="voice-translation-btn" onclick="window.meaoCat.toggleTranslationMode('en-ja')">
                    <span>🎤</span> EN→JA Translation
                </button>
                <button class="voice-translation-btn-ja" id="voice-translation-btn-ja" onclick="window.meaoCat.toggleTranslationMode('ja-en')">
                    <span>🎌</span> JA→EN Translation
                </button>
            </div>
            
            <div class="voice-status" id="voice-status">
                <span class="inactive">🔇 Translation Off</span>
            </div>
        </div>

        <!-- English to Japanese Translation Panel -->
        <div class="translation-panel" id="translation-panel-en-ja">
            <div class="translation-header">
                <h3>🎌 Live English → Japanese Translation</h3>
                <button class="clear-translations-btn" onclick="window.meaoCat.clearAllTranslations('en-ja')">Clear All</button>
            </div>
            
            <div class="interim-transcript" id="interim-transcript-en-ja">
                <!-- Live transcript appears here -->
            </div>
            
            <div class="translation-list" id="translation-list-en-ja">
                <!-- Translation results appear here -->
            </div>
        </div>

        <!-- Japanese to English Translation Panel -->
        <div class="translation-panel" id="translation-panel-ja-en">
            <div class="translation-header">
                <h3>🎌 Live Japanese → English Translation</h3>
                <button class="clear-translations-btn" onclick="window.meaoCat.clearAllTranslations('ja-en')">Clear All</button>
            </div>
            
            <div class="interim-transcript" id="interim-transcript-ja-en">
                <!-- Live transcript appears here -->
            </div>
            
            <div class="translation-list" id="translation-list-ja-en">
                <!-- Translation results appear here -->
            </div>
        </div>

        <!-- Results area (for future use) -->
        <div class="results-container" id="results-container">
            <!-- Dictionary results will appear here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
